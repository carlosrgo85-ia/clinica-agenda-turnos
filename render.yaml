# Blueprint de Render: base, servidor web y worker. Ver docs/despliegue.md.
# Los valores marcados sync:false se cargan a mano en el panel (son secretos).
databases:
  - name: clinica-db
    plan: basic-256mb   # verificar el plan vigente: tiene que incluir respaldos y no pausarse
    region: oregon      # elegir la más cercana a la clínica

services:
  - type: web
    name: clinica-web
    runtime: docker
    region: oregon
    healthCheckPath: /health
    # Las migraciones corren ANTES de levantar la nueva versión; si fallan, no se despliega.
    preDeployCommand: npx prisma migrate deploy
    envVars: &env
      - key: DATABASE_URL
        fromDatabase: { name: clinica-db, property: connectionString }
      - key: TRUST_PROXY_HOPS
        value: "2"   # Render va detrás de Cloudflare (verificado 2026-11-24: con 1 la IP era 172.71.x.x); ver docs/despliegue.md
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CALENDAR_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: PLATFORM_TIMEZONE
        value: UTC

  # UNA sola instancia, siempre: si se escala, cada paciente recibe cada recordatorio repetido.
  - type: worker
    name: clinica-worker
    runtime: docker
    region: oregon
    dockerCommand: npm run start:worker
    numInstances: 1
    envVars: *env
